server {
    listen 80;
    server_name _;
    client_max_body_size 20m;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz { proxy_pass http://api:5000/healthz; }
    location /api/ {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location = /instagram { proxy_pass http://api:5000; }
    location /telegram/ { proxy_pass http://api:5000; }
    location /bale/ { proxy_pass http://api:5000; }
    location ^~ /hooshang_update/ { return 404; }
    location ^~ /admin-panel { return 404; }
    location ^~ /admin-panel-manager { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
